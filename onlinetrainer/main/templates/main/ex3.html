{% extends "main/base.html" %}
{% load static %}

{% block content %}
{% if user.is_authenticated %}
<div id="exerciseContent">
    <div class="exerc" style="position: relative;">
        <div>
            <p><br></p>
            <p><br></p>

            <p>Віджимання</p>
            <div style="text-align: center;">
                <video src="{% static 'videos/video3.mp4' %}" class="d-block" controls></video>
            </div>
            <div>
                <a href="{% url 'chose3' %}" class="btn" style="margin-top: 20px;">Перейти до виконання</a>
            </div>
        </div>
        <div style="position: absolute; top: 75px; left: 30px;">
            <button class="button" onclick="window.history.back()" style="padding: 6px 12px; background-color: #000000; border: none; color: white; font-size: 12px; border-radius: 5px;  font-family: 'Play', sans-serif;">
                ← Назад
            </button>
        </div>
    </div>
</div>
{% else %}
<div id="loginPrompt" style="text-align: center; padding: 50px; background-color: #21212d; height: 400px;">
    <p style="font-size: 18px; color: white; font-family: 'Play', sans-serif;">
        Для того щоб виконати вправу,
        <a href="{% url 'login' %}" style="color: #6617bb; text-decoration: none;">залогінтесь</a>
        або, якщо ще не зареєстровані,
        <a href="{% url 'registration_form' %}" style="color: #6617bb; text-decoration: none;">зареєструйтесь</a>.
    </p>
</div>
{% endif %}
{% endblock %}
