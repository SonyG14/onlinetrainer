{% extends "main/base.html" %}

{% block content %}
<div class="profile">
    <div class="profile-block">

        <h2>Профіль користувача</h2>
        <br><br>
        <p>Ім'я користувача: {{ user.username }}</p>
        <p>Email: {{ user.email }}</p>
        <br><br>

        <button id="openGoalsModalBtn" class="btn" style="width:240px">Налаштувати мої цілі</button>
    </div>

    <div id="goalsModal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>Налаштування цілей</h2>
            <p style="color: white; font-family: 'Play', sans-serif;">
                Тут ви зможете налаштовувати свої цілі.
            </p>
            <button id="saveGoalsBtn" class="btn">Зберегти цілі</button>
        </div>
    </div>
</div>

<style>
    .modal {
        display: none;
        position: fixed;
        z-index: 1;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgba(0,0,0,0.4);
    }

    .modal-content {
        background-color: #000000;
        margin: 15% auto;
        padding: 20px;
        border: 1px solid #888;
        width: 40%;
        border-radius: 5px;
        position: relative;
    }

    .close-button {
        color: #aaa;
        float: right;
        font-size: 28px;
        font-weight: bold;
    }

    .close-button:hover,
    .close-button:focus {
        color: black;
        text-decoration: none;
    }
</style>

<script>
    const modal = document.getElementById("goalsModal");
    const openBtn = document.getElementById("openGoalsModalBtn");
    const closeBtn = document.querySelector(".close-button");
    const saveBtn = document.getElementById("saveGoalsBtn");

    openBtn.addEventListener("click", () => {
        modal.style.display = "block";
    });

    closeBtn.addEventListener("click", () => {
        modal.style.display = "none";
    });

    window.addEventListener("click", (event) => {
        if (event.target == modal) {
            modal.style.display = "none";
        }
    });

    saveBtn.addEventListener("click", () => {
        alert("Цілі збережено!");
        modal.style.display = "none";
    });
</script>
{% endblock %}
