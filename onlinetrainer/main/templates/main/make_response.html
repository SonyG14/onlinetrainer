{% extends "main/base.html" %}
{% block content %}

<div class="make-response">
  <p><br></p>
<div class="make-response-container">
  <h3 class="add">Додати відгук</h3>
  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}

    <div class="btn-row">
      <a href="{% url 'responses' %}" class="btn">Скасувати</a>
      <button type="submit" class="btn">Додати</button>
    </div>
  </form>
</div>
</div>
{% endblock %}
